server:
  port: 8084

spring:
  application:
    name: servico-cozinha

  datasource:
    url: jdbc:h2:mem:cozinhadb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # use o MESMO RabbitMQ do servicoPedido (as filas sao o contrato entre os dois).
  # Usuario e senha vem de variaveis de ambiente: nao grave credenciais no repositorio.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

app:
  mensageria:
    # false = nao usa RabbitMQ: os pedidos entram por POST /cozinha/pedidos e os avisos so aparecem no log
    #         -> da para testar o servicoCozinha sozinho.
    # true  = escuta pedido-criado / pedido-cancelado e publica pedido-status-cozinha.
    habilitada: "${MENSAGERIA_HABILITADA:false}"
